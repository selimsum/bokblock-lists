name: Daily Release

on:
  push:
    branches:
      - master
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release tag
        id: tag
        run: echo "TAG=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create or update release and upload list files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"

          # Update the "Last updated" line in each .txt file before uploading
          for f in *.txt; do
            sed -i "s/^# Last updated: .*/# Last updated: $TAG/" "$f"
          done

          # Point today's tag to the current commit
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.txt --clobber
          else
            gh release create "$TAG" \
              --title "Filter Lists $TAG" \
              --notes "Automated daily release of BlockTube filter lists." \
              *.txt
          fi

      - name: Update latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push origin latest --force
